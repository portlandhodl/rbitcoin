[package]
name = "rbitcoin-cli"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "rbitcoin RPC CLI client"

[lib]
test = false

[[bin]]
name = "rbitcoin-cli"
path = "src/main.rs"

[features]
mutants = []

[dependencies]
rbitcoin-primitives = { workspace = true }
mimalloc = { workspace = true }
serde_json = { workspace = true }
socket2 = { version = "0.6", features = ["all"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
