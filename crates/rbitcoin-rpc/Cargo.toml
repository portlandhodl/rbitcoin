[package]
name = "rbitcoin-rpc"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Core-class JSON-RPC HTTP server (subset; not full Core parity)"

[lib]
test = false

[features]
mutants = []

[dependencies]
rbitcoin-primitives = { workspace = true }
rbitcoin-log = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-net = { workspace = true }
rbitcoin-consensus = { workspace = true }
bitcoin = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
getrandom = "0.4"
base64 = "0.23"

[dev-dependencies]
rbitcoin-consensus = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true
